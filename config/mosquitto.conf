per_listener_settings true

# TLS Configuration
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker/broker.crt
keyfile /mosquitto/certs/broker/broker.key
tls_version tlsv1.2
ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
require_certificate true           
use_subject_as_username false      # keep auth by user/pass

# Security 
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
allow_zero_length_clientid false

# SYS topics
sys_interval 30

# Logging options
log_dest file /mosquitto/log/mosquitto.log
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S%z
# Logging options - Uncomment the desired log type
#log_type all
log_type error
log_type warning
log_type notice
#log_type information
#log_type subscribe
#log_type unsubscribe
#log_type websockets
#log_type none
#log_type debug

# Performance
persistence true
persistence_location /mosquitto/data/